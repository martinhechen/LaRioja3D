<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico RA — Hyrax</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body{
      margin:0;
      padding:20px;
      background:#111;
      color:#eee;
      font-family:Arial,sans-serif;
    }

    h1{
      font-size:20px;
      margin-top:0;
    }

    #status{
      background:#222;
      border:1px solid #555;
      border-radius:8px;
      padding:12px;
      line-height:1.6;
      margin-bottom:15px;
      font-size:14px;
    }

    model-viewer{
      width:100%;
      max-width:600px;
      height:400px;
      margin:auto;
      display:block;
      background:#222;
      border-radius:12px;
    }

    #ar-button{
      background:#d69a4c;
      color:#20160a;
      border:0;
      border-radius:8px;
      padding:12px 18px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <h1>Diagnóstico RA — Hyrax</h1>

  <div id="status">
    <div>🟡 Página cargada.</div>
    <div>⏳ Esperando al modelo...</div>
  </div>

  <model-viewer
    id="viewer"
    src="https://martinhechen.github.io/LaRioja3D/modelos/modelo01.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    alt="Hyrax">

    <button id="ar-button" slot="ar-button">
      📱 Ver en Realidad Aumentada
    </button>

  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    function log(msg) {
      status.innerHTML += `<div>${msg}</div>`;
    }

    viewer.addEventListener('load', () => {
      log('✅ MODELO CARGADO CORRECTAMENTE');
    });

    viewer.addEventListener('error', (event) => {
      console.error(event);
      log('❌ ERROR AL CARGAR EL MODELO');
      log('Revisá la consola del navegador si fuera necesario.');
    });

    viewer.addEventListener('ar-status', (event) => {
      log('📱 Estado RA: ' + event.detail.status);
    });

    if (navigator.userAgent.match(/Android/i)) {
      log('🤖 Android detectado');
    } else {
      log('📱 Dispositivo no identificado como Android');
    }
  </script>

</body>
</html>
