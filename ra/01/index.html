<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hyrax — Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root{--bg:#16140f;--text:#ece6d8;--dim:#9c917c;--accent:#d69a4c;--border:#362f22}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{display:flex;justify-content:center}
    .card{width:min(720px,100%);padding:24px 18px 32px;text-align:center}
    .glyph{font-size:30px;color:var(--accent);margin-bottom:8px}
    h1{font-size:22px;margin:0 0 8px}
    p{font-size:14px;line-height:1.55;color:var(--dim);margin:0 0 14px}
    model-viewer{display:block;width:100%;height:min(62vh,520px);min-height:320px;background:#201b13;border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .note{font-size:12px;margin-top:12px}
    #ar-button{background:linear-gradient(135deg,#8a6530,#d69a4c);color:#20160a;border:0;border-radius:9px;padding:12px 20px;font-size:15px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="glyph">◆</div>
    <h1>Hyrax</h1>
    <p>Mové el modelo con el dedo y, cuando estés listo, tocá el botón para colocarlo en tu espacio.</p>

    <model-viewer
      src="../../modelos/modelo01.glb"
      alt="Modelo 3D de Hyrax"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      ar-placement="floor">
      <button slot="ar-button" id="ar-button">📱 Ver en Realidad Aumentada</button>
    </model-viewer>

    <p class="note">En Android, Chrome suele ofrecer Scene Viewer. En iPhone/iPad, Safari puede ofrecer Quick Look. La disponibilidad depende del dispositivo y navegador.</p>
  </main>
</body>
</html>
